name: "Close stale issues and PRs"
on:
  schedule:
    - cron: "30 1 * * *" # run at 0130 UTC

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-stale: 30
          days-before-close: 5
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: pinned,wip,security,notice
          exempt-all-milestones: true
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 5 days if no further activity occurs.
            Thank you for your contributions.
